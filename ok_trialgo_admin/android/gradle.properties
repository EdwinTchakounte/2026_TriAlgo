# Memoire de la JVM Gradle.
#
# Ces valeurs etaient a -Xmx8G et MaxMetaspaceSize=4G, soit jusqu'a
# 12 Go demandes par un seul processus. Sur un poste de 16 Go dont
# 11 sont deja pris, le noyau tue le demon en cours de route et le
# build echoue sur un message qui ne dit rien de la cause :
#
#   Gradle build daemon disappeared unexpectedly
#
# Le reflexe est d'augmenter encore, ce qui aggrave exactement le
# probleme. 3 Go suffisent largement a un build Flutter Android ;
# au-dela, la JVM ne va pas plus vite, elle reserve seulement de la
# memoire que la machine n'a pas.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
