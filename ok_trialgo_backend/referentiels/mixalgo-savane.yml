# =============================================================
# FICHIER : referentiels/mixalgo-savane.yml
# ROLE    : Source de verite du graphe d'un jeu MIXALGO
# =============================================================
#
# CE FICHIER EST LA SOURCE, PAS UN RESUME.
# ------------------------------------------
# Le dictionnaire illustre (dictionnaire/dictionnaire.jpeg) est un
# INDEX : il repete chaque trio une fois par carte concernee, donc
# 2 a 3 fois. Maintenu a la main, il finit toujours par diverger --
# il se contredisait deja (B4+D9 y donnait P8 a une entree et E7 a
# une autre, et deux couples y etaient ecrits dans les deux sens).
#
# Ici chaque trio n'apparait QU'UNE FOIS. Le dictionnaire se
# regenere depuis ce fichier, jamais l'inverse.
#
# LES DEUX FORMES D'UN TRIO
# -------------------------
#   parents: [X, Y]     racine  -- X et Y sont poses explicitement
#   depuis: nNN         enfant  -- herite l'enfant du trio nNN
#   avec: Z             le second parent d'un enfant
#
# `parents` est une paire NON ORDONNEE : [C9, D8] et [D8, C9]
# designent le meme trio, et le validateur les refuse en double.
# La fusion ne depend pas de l'ordre.
#
# `depuis` en revanche est explicite et obligatoire des qu'un trio
# se chaine. Ce n'est pas une redondance : quand les DEUX parents
# sont eux-memes des enfants d'autres trios (8 cas ici), l'ordre
# ecrit etait la seule chose qui disait a quelle chaine le trio
# appartient -- une information qu'une paire non ordonnee perd.
# Le chainage change les elements disponibles, donc les questions
# generees. Il devait devenir explicite.
#
# CE QUI N'EST PAS ECRIT ICI
# --------------------------
# depth, node_index et parent_node_id sont CALCULES a l'import.
# Ajouter un trio = ajouter une ligne, rien d'autre a renumeroter.
# =============================================================

jeu: mixalgo-savane
libelle: MIXALGO -- Savane
version: 1

# -------------------------------------------------------------
# CARTES
# -------------------------------------------------------------
# `image` est un nom de fichier, resolu par l'importeur dans le
# dossier passe via --images. Le libelle est ce que le joueur lit
# (mode collectif, ecran de resultat) : a renseigner.
# -------------------------------------------------------------
