{% extends "_base.html" %}
{% block content %}
<h2 style="margin:0 0 12px;color:#fff">Nouveau jeu disponible</h2>
<p>Un nouveau jeu vient d'etre publie : <strong>{{ game_name }}</strong>.</p>
{% if game_description %}<p>{{ game_description }}</p>{% endif %}
<p style="text-align:center;margin:28px 0">
    <a href="{{ game_url }}"
       style="background:#7fdcff;color:#0e1116;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:700;display:inline-block">
        Decouvrir le jeu
    </a>
</p>
<p style="font-size:12px;color:#7c8694">
    Vous pouvez desactiver ces notifications dans vos preferences email.
</p>
{% endblock %}
