<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#0e1116;font-family:Arial,Helvetica,sans-serif;color:#e8eaed">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e1116">
        <tr>
            <td align="center" style="padding:32px 16px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="max-width:560px;background:#161a22;border-radius:14px;padding:32px;border:1px solid #1f2630">
                    <tr>
                        <td align="center" style="padding-bottom:24px">
                            <div style="font-size:28px;font-weight:700;letter-spacing:2px;color:#7fdcff">TRIALGO</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:15px;line-height:1.55">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top:32px;font-size:12px;color:#7c8694">
                            Vous recevez ce mail car vous avez un compte TRIALGO.<br>
                            &copy; TRIALGO
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
