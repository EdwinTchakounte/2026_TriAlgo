# =============================================================
# FICHIER : docker/nginx/mixalgo.com.conf
# ROLE    : Vhost nginx de la vitrine publique (mixalgo.com)
# =============================================================
# Troisieme et dernier vhost de la topologie :
#
#   mixalgo.com            vitrine publique      /srv/vitrine
#   api.mixalgo.com        API FastAPI           127.0.0.1:8000
#   dashboard.mixalgo.com  studio admin          /srv/dashboard
#
# Contrairement aux deux autres, celui-ci ne fait AUCUN proxy.
# Il sert des fichiers statiques, et c'est le navigateur du
# visiteur qui appelle api.mixalgo.com pour afficher les cartes
# du deck.
#
# INSTALLATION
#   sudo mkdir -p /srv/vitrine
#   sudo rsync -a --delete vitrine/ /srv/vitrine/
#   sudo chown -R www-data:www-data /srv/vitrine
#
#   sudo cp docker/nginx/mixalgo.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/mixalgo.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mixalgo.com -d www.mixalgo.com
#
# PREREQUIS DNS
#   mixalgo.com      A  <ip-du-serveur>
#   www.mixalgo.com  A  <ip-du-serveur>
#
# NE PAS ecrire ici les directives ssl_* ni la redirection
# 80 -> 443 : certbot les pose lui-meme et les reecrit a chaque
# renouvellement. Les poser a la main mene a un doublon silencieux.
# =============================================================


# -------------------------------------------------------------
# www -> apex
# -------------------------------------------------------------
# Une seule adresse canonique. Servir le meme contenu sur deux
# hotes divise le referencement entre eux : les moteurs y voient
# deux sites jumeaux, et aucun des deux ne recoit le poids que
# l'unique site aurait eu. La balise <link rel="canonical"> de la
# page le dit deja ; cette redirection le rend definitif.
server {
    listen 80;
    listen [::]:80;
    server_name www.mixalgo.com;
    return 301 https://mixalgo.com$request_uri;
}


server {
    listen 80;
    listen [::]:80;
    server_name mixalgo.com;

    root /srv/vitrine;
    index index.html;

    # ---------------------------------------------------------
    # Compression
    # ---------------------------------------------------------
    # La page fait environ 45 Ko de HTML et de CSS avant
    # compression, et retombe sous 10 Ko avec. Sur une connexion
    # mobile lente, c'est la difference entre un affichage
    # immediat et une seconde d'attente sur du texte.
    #
    # Ni les images ni le WebP ne sont listes : ils sont deja
    # compresses, les recompresser coute du processeur et ne
    # gagne rien.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript
               application/json image/svg+xml application/xml;

    # ---------------------------------------------------------
    # En-tetes de securite, niveau serveur
    # ---------------------------------------------------------
    # ATTENTION : ces trois lignes sont ANNULEES dans tout bloc
    # `location` qui declare son propre add_header. nginx ne les
    # cumule pas, il les remplace. Elles sont donc repetees plus
    # bas dans chaque location concernee. Sans cette repetition,
    # index.html -- la toute premiere reponse que recoit un
    # visiteur -- serait servi sans protection pendant que le
    # reste du site les porte.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------
    # La page elle meme : jamais en cache
    # ---------------------------------------------------------
    # Elle reference les visuels et le script. Un index.html
    # perime chez un visiteur continue de demander des fichiers
    # qui ont pu changer, et la page se casse sans que rien ne
    # le signale.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------
    # Visuels : cache long
    # ---------------------------------------------------------
    # Le logo, la favicon et l'image de partage ne changent
    # pratiquement jamais. Sept jours plutot qu'un an parce que
    # leurs noms ne portent PAS d'empreinte de contenu : un cache
    # d'un an rendrait toute correction invisible pendant un an
    # pour les visiteurs deja venus.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------
    # Script : cache court
    # ---------------------------------------------------------
    # Meme raison, en plus serre : le script est la partie la plus
    # susceptible d'etre corrigee apres une mise en ligne.
    location /scripts/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------
    # L'APK
    # ---------------------------------------------------------
    # Deux precautions.
    #
    # 1. Le TYPE MIME. Sans lui, nginx annonce
    #    application/octet-stream et certains navigateurs Android
    #    refusent d'ouvrir le fichier avec l'installateur : le
    #    telechargement reussit, et rien ne se passe au clic.
    #
    # 2. Le nom de fichier propose. Sans Content-Disposition, un
    #    fichier renomme cote serveur arrive sous un nom que le
    #    visiteur ne reconnait pas dans son dossier de
    #    telechargements.
    location /telechargements/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="mixalgo.apk"' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------
    # Fichiers de referencement
    # ---------------------------------------------------------
    # Un cache long sur le plan de site retarde la prise en compte
    # d'une nouvelle page par les moteurs. Une heure suffit.
    location = /robots.txt  { expires 1h; }
    location = /sitemap.xml { expires 1h; }

    # Aucun fichier cache n'a de raison d'etre servi ici.
    location ~ /\. { deny all; }
}
