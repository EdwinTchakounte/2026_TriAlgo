# =============================================================
# FICHIER : docker/nginx/api.mixalgo.com.conf
# ROLE    : Vhost nginx de l'API et des images de cartes
# =============================================================
# Traduction du bloc `api.mixalgo.com` du Caddyfile, pour un
# nginx deja installe sur l'hote (voir docker-compose.nginx.yml).
#
# INSTALLATION
#   sudo cp docker/nginx/api.mixalgo.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.mixalgo.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis le certificat (certbot est deja en place sur ce serveur) :
#   sudo certbot --nginx -d api.mixalgo.com
#
# certbot ajoute lui-meme les directives ssl_* et le bloc de
# redirection 80 -> 443. Ne pas les ecrire a la main ici : il les
# reecrirait au renouvellement.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.mixalgo.com;

    # ---------------------------------------------------------
    # Taille maximale des televersements
    # ---------------------------------------------------------
    # LA LIGNE A NE PAS OUBLIER. nginx plafonne par defaut a 1 Mo,
    # alors que l'API accepte jusqu'a MAX_UPLOAD_BYTES (5 Mo).
    # Sans cette directive, toute carte pesant entre 1 et 5 Mo est
    # rejetee par nginx avec un 413 -- une erreur que l'API n'a
    # jamais emise, qui n'apparait dans aucun de ses journaux, et
    # que le studio affiche telle quelle. On cherche longtemps.
    #
    # Volontairement un peu au-dessus de 5 Mo : ainsi c'est l'API
    # qui refuse, avec son propre message explicite, plutot que
    # nginx avec une page d'erreur muette.
    client_max_body_size 6m;

    # ---------------------------------------------------------
    # Images des cartes  ->  MinIO
    # ---------------------------------------------------------
    # La barre oblique finale de proxy_pass est signifiante : elle
    # retire le prefixe /files avant transmission.
    #
    #   recu      : /files/trialgo-cards/<jeu>/<uuid>.jpg
    #   transmis  : /trialgo-cards/<jeu>/<uuid>.jpg
    #
    # MinIO attend en effet /<bucket>/<cle> a la racine. C'est
    # pourquoi S3_PUBLIC_ENDPOINT_URL doit valoir exactement
    # "https://api.mixalgo.com/files", SANS barre finale : le
    # backend y ajoute lui-meme "/<bucket>/<cle>".
    #
    # Retirer la barre de proxy_pass ci-dessous transmettrait
    # /files/... a MinIO, qui chercherait un bucket nomme "files"
    # et repondrait 404 sur toutes les images.
    location /files/ {
        # Lecture seule. Sans ce filtre, nginx relaierait aussi
        # PUT, POST et DELETE : toute l'API S3 de MinIO se
        # retrouverait exposee publiquement alors que le public
        # n'a besoin que de lire des images. La politique du
        # bucket refuse deja ces ecritures, mais defendre a deux
        # endroits coute trois lignes, et une politique de bucket
        # se change par inadvertance.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les images sont immuables (cle = UUID) : le cache du
        # navigateur peut les garder indefiniment. L'en-tete est
        # deja pose par MinIO ; on ne le duplique pas ici.
    }

    # ---------------------------------------------------------
    # Tout le reste  ->  API FastAPI
    # ---------------------------------------------------------
    # Aucun risque de collision avec /files : l'API n'expose que
    # /api/*, /healthz, /docs, /openapi.json et les deux pages de
    # rebond des courriels (/reset-password, /confirm-email).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ---- Ce que lit le limiteur de debit ----
        # $proxy_add_x_forwarded_for AJOUTE l'IP du client a la
        # valeur recue, il ne la remplace pas. Le DERNIER maillon
        # de la liste est donc celui ecrit par ce nginx : c'est le
        # seul digne de confiance, les precedents etant fournis
        # par le client et donc falsifiables.
        #
        # app/core/rate_limit.py lit precisement ce dernier
        # element. Comportement identique a celui de Caddy, contre
        # lequel le code a ete ecrit et teste.
        #
        # Corollaire indispensable dans le .env de production :
        #   TRUST_PROXY_HEADERS=true
        # Sans cela l'API voit toutes les requetes venir de
        # 127.0.0.1 et les compte dans un unique compteur partage :
        # le premier utilisateur un peu actif bloque tous les
        # autres.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le televersement d'une image traverse tout le pipeline
        # de traitement (magic bytes, conversion, resize,
        # reencodage) avant que l'API ne reponde. Les 60 secondes
        # par defaut suffisent largement, mais on les rend
        # explicites plutot que subies.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------
    # Compression
    # ---------------------------------------------------------
    # JSON et HTML uniquement. Les JPEG sont deja compresses :
    # les repasser en gzip coute du CPU et ne gagne rien.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ---------------------------------------------------------
    # En-tetes de securite
    # ---------------------------------------------------------
    # `always` : sans ce mot-cle, nginx omet l'en-tete sur les
    # reponses d'erreur (4xx, 5xx) -- exactement celles ou une
    # attaque a le plus de chances de se produire.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Ne pas divulguer la version de nginx. A poser dans
    # /etc/nginx/nginx.conf pour valoir partout ; rappele ici car
    # le Caddyfile retirait l'en-tete Server.
    server_tokens off;

    access_log /var/log/nginx/trialgo-api.access.log;
    error_log  /var/log/nginx/trialgo-api.error.log;
}
