# =============================================================
# FICHIER : docker/nginx/dashboard.mixalgo.com.conf
# ROLE    : Vhost nginx du studio admin (build Flutter web)
# =============================================================
# Traduction du bloc `dashboard.mixalgo.com` du Caddyfile.
#
# Ici nginx ne fait pas de proxy : il sert des fichiers statiques.
# Le studio est une application Flutter compilee en web, sans
# aucune route serveur -- c'est du HTML, du JS et des assets.
#
# INSTALLATION
#   # 1. Produire le build, en pointant vers l'API de production
#   cd ok_trialgo_admin
#   flutter build web --release \
#     --dart-define=API_BASE_URL=https://api.mixalgo.com
#
#   # 2. Le deposer sur le serveur
#   sudo mkdir -p /srv/dashboard
#   sudo rsync -a --delete build/web/ /srv/dashboard/
#   sudo chown -R www-data:www-data /srv/dashboard
#
#   # 3. Activer le vhost
#   sudo cp docker/nginx/dashboard.mixalgo.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dashboard.mixalgo.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.mixalgo.com
#
# PREREQUIS DNS : dashboard.mixalgo.com  A  <ip-du-serveur>
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.mixalgo.com;

    root /srv/dashboard;
    index index.html;

    # ---------------------------------------------------------
    # Routage cote client
    # ---------------------------------------------------------
    # Flutter web gere ses routes dans le navigateur : le serveur
    # ne connait que index.html. Sans ce repli, recharger la page
    # sur une route profonde (/codes, /users...) demande a nginx un
    # fichier qui n'existe pas -> 404, ecran blanc.
    #
    # On renvoie donc index.html pour tout chemin inconnu, et
    # l'application retrouve sa route elle-meme.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------
    # Cache
    # ---------------------------------------------------------
    # index.html NE DOIT PAS etre mis en cache. Il reference les
    # bundles par leur nom ; un index.html perime pointe vers des
    # fichiers supprimes au deploiement suivant, et le studio
    # s'ouvre sur une page blanche jusqu'a un vidage manuel du
    # cache du navigateur. Symptome classique et deroutant : "ca
    # marche chez moi", parce que le navigateur du developpeur a
    # ete rafraichi.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Les deux lignes suivantes sont une REPETITION VOULUE.
        # nginx n'herite pas les add_header du niveau serveur des
        # qu'un bloc en declare un a lui : les directives ne
        # s'ajoutent pas, elles se remplacent. Sans ce rappel,
        # index.html -- la toute premiere reponse que recoit un
        # visiteur -- serait servi sans HSTS ni nosniff, pendant
        # que le reste du site les porterait. Le controle passe,
        # la protection manque.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Le reste (main.dart.js, assets, polices) porte un nom stable
    # entre deux builds mais un contenu qui change. Un cache court
    # avec revalidation evite de re-telecharger 3 Mo a chaque
    # ouverture sans risquer de servir un bundle perime.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|json)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        # Meme raison que ci-dessus : add_header ne s'herite plus.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    access_log /var/log/nginx/trialgo-dashboard.access.log;
    error_log  /var/log/nginx/trialgo-dashboard.error.log;
}
